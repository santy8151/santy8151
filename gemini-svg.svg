<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" width="100%" height="100%">
  <defs>
    <style>
      /* ESTILOS GENERALES */
      .bg { fill: #050b14; }
      .panel { fill: #0a1526; stroke: #123456; stroke-width: 1.5; }
      .panel:hover { stroke: #00e5ff; cursor: pointer; }
      .text-main { fill: #ffffff; font-family: 'Segoe UI', -apple-system, sans-serif; }
      .text-sub { fill: #7a9aab; font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; }
      .text-mono { fill: #00e5ff; font-family: 'Courier New', monospace; }
      .text-terminal { fill: #00e5ff; font-family: 'Consolas', 'Courier New', monospace; font-size: 18px; }
      
      .tag-bg { fill: #0d273e; stroke: #00e5ff; stroke-width: 1; rx: 12; }
      .tag-text { fill: #00e5ff; font-family: 'Courier New', monospace; font-size: 12px; }
      
      /* LÓGICA DE TRANSICIÓN (ESCÁNER -> PERFIL) */
      .intro-screen {
        animation: hideIntro 0.5s ease-in 4.5s forwards;
      }
      .profile-screen {
        opacity: 0;
        visibility: hidden;
        animation: showProfile 0.5s ease-in 4.8s forwards;
      }
      
      @keyframes hideIntro {
        to { opacity: 0; visibility: hidden; }
      }
      @keyframes showProfile {
        to { opacity: 1; visibility: visible; }
      }

      /* ANIMACIONES DEL ESCÁNER */
      @keyframes scanMove {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(160px); }
      }
      .scan-line {
        animation: scanMove 2s linear infinite;
      }
      
      /* ANIMACIÓN BARRA DE PROGRESO AL 100% */
      @keyframes fillBar {
        0% { width: 0; }
        100% { width: 380px; }
      }
      .progress-fill {
        animation: fillBar 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      /* MASCARA TERMINAL INFERIOR */
      .terminal-box { stroke: #00e5ff; stroke-width: 1.5; fill: #030811; }
    </style>

    <!-- Clip path para foto (Opcional) -->
    <clipPath id="photo-clip">
      <rect x="40" y="60" width="120" height="120" rx="12" />
    </clipPath>

    <!-- Máscara animada para escritura de consola inferior -->
    <mask id="typewriter-mask">
      <rect x="0" y="0" width="0" height="40" fill="white">
        <!-- Comienza a los 5s para esperar a que cargue el perfil -->
        <animate attributeName="width" from="0" to="400" dur="2s" begin="5s" fill="freeze" />
      </rect>
    </mask>
  </defs>

  <!-- FONDO BASE -->
  <rect class="bg" width="100%" height="100%" rx="10" />

  <!-- ========================================== -->
  <!-- 1. PANTALLA DE CARGA (ESCÁNER AL 100%)     -->
  <!-- ========================================== -->
  <g class="intro-screen">
    
    <!-- Texto Superior -->
    <text x="40" y="40" class="text-sub" font-family="monospace" font-size="12">HUMAN // DEVELOPER // PROBLEM SOLVER</text>
    <text x="960" y="40" class="text-sub" font-family="monospace" font-size="12" text-anchor="end">SANTIAGO.SR // v3.0</text>
    <text x="40" y="100" font-family="monospace" font-size="16" font-weight="bold" fill="#00e5ff">AUTENTICACIÓN BIOMÉTRICA</text>
    <text x="40" y="120" class="text-sub" font-family="monospace" font-size="12">PROFILE SCANNER // NODE 01</text>

    <!-- LADO IZQUIERDO: Escáner sobre la Foto -->
    <g transform="translate(150, 320)">
      <!-- Círculos decorativos rotando -->
      <circle cx="100" cy="100" r="140" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>
      <circle cx="100" cy="100" r="120" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="10 5" opacity="0.4">
         <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="100" r="170" fill="none" stroke="#00ff99" stroke-width="1" opacity="0.1"/>

      <!-- Contenedor del Avatar a Escanear -->
      <rect x="20" y="20" width="160" height="160" rx="15" fill="#0f2537" stroke="#00e5ff" stroke-width="2" />
      <text x="100" y="115" fill="#00e5ff" font-family="monospace" font-size="60" font-weight="bold" text-anchor="middle">SS</text>
      
      <!-- Línea del Escáner Animada -->
      <g class="scan-line">
        <line x1="-10" y1="20" x2="210" y2="20" stroke="#00ff99" stroke-width="3" filter="drop-shadow(0 0 5px #00ff99)"/>
        <polygon points="100,20 60,-20 140,-20" fill="#00ff99" opacity="0.3"/>
      </g>
    </g>
    
    <!-- LADO DERECHO: Terminal de Reconocimiento y Barra de Progreso -->
    <g transform="translate(520, 320)">
      <!-- Textos apareciendo secuencialmente -->
      <text x="0" y="0" class="text-mono" font-size="14" fill="#00ff99" font-weight="bold">
        <tspan x="0" dy="0" opacity="0">
          [√] SCANNING BIOMETRIC DATA...
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="4.5s" begin="0s" fill="freeze"/>
        </tspan>
        <tspan x="0" dy="30" opacity="0">
          [√] ANALYZING PATTERN...
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="4.5s" begin="0.8s" fill="freeze"/>
        </tspan>
        <tspan x="0" dy="30" opacity="0">
          [√] MATCHING IDENTITY...
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="4.5s" begin="1.6s" fill="freeze"/>
        </tspan>
        <tspan x="0" dy="30" opacity="0">
          [√] VERIFYING PROFILE...
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="4.5s" begin="2.4s" fill="freeze"/>
        </tspan>
        <tspan x="0" dy="30" opacity="0">
          [√] REGISTERING USER...
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="4.5s" begin="3.2s" fill="freeze"/>
        </tspan>
      </text>
      
      <!-- Barra de Progreso llenándose -->
      <rect x="0" y="180" width="380" height="15" rx="4" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="0" y="180" width="0" height="15" rx="4" fill="#00e5ff" class="progress-fill" />
      
      <!-- Mensaje de Éxito Final (Aparece a los 3.8s) -->
      <rect x="0" y="220" width="380" height="40" rx="5" fill="none" stroke="#00ff99" stroke-width="2" opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.8s" fill="freeze"/>
      </rect>
      <text x="190" y="245" font-family="monospace" font-size="14" font-weight="bold" fill="#00ff99" text-anchor="middle" opacity="0">
          ✓ ACCESS GRANTED // IDENTITY VERIFIED
          <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.8s" fill="freeze"/>
      </text>
    </g>

  </g>

  <!-- ========================================== -->
  <!-- 2. PANTALLA PRINCIPAL DEL PERFIL           -->
  <!-- ========================================== -->
  <g class="profile-screen">
    
    <g transform="translate(40, 40)">
      <!-- Texto superior izquierdo -->
      <text x="0" y="0" fill="#00ff99" font-family="monospace" font-size="12" font-weight="bold">✓ PROFILE REGISTERED</text>
      
      <!-- Contenedor principal del perfil -->
      <rect x="0" y="15" width="920" height="230" rx="15" class="panel" />

      <!-- Avatar Foto Placeholder ("SS") -->
      <rect x="25" y="40" width="120" height="120" rx="12" fill="#0f2537" stroke="#00e5ff" stroke-width="2" />
      <text x="85" y="112" fill="#00e5ff" font-family="monospace" font-size="45" font-weight="bold" text-anchor="middle">SS</text>

      <!-- Info del Usuario -->
      <text x="170" y="70" class="text-main" font-size="28" font-weight="bold">Santiago Suarez Ramirez</text>
      <text x="170" y="95" class="text-mono" font-size="16" font-weight="bold">Software Developer</text>
      <text x="170" y="115" class="text-sub">Full-Stack · Cloud · AI</text>
      <text x="170" y="135" class="text-sub">Medellín, Colombia</text>

      <!-- Bio -->
      <text x="170" y="170" class="text-main" font-size="14">Desarrollador de software enfocado en construir sistemas prácticos que</text>
      <text x="170" y="190" class="text-main" font-size="14">combinan arquitectura en la nube, inteligencia artificial, ciberseguridad,</text>
      <text x="170" y="210" class="text-main" font-size="14">automatización, blockchain y diagnóstico automotriz.</text>

      <!-- Etiquetas -->
      <g transform="translate(170, 235)">
        <rect x="0" y="0" width="65" height="24" class="tag-bg"/> <text x="32" y="16" class="tag-text" text-anchor="middle">Python</text>
        <rect x="75" y="0" width="70" height="24" class="tag-bg"/> <text x="110" y="16" class="tag-text" text-anchor="middle">FastAPI</text>
        <rect x="155" y="0" width="55" height="24" class="tag-bg"/> <text x="182" y="16" class="tag-text" text-anchor="middle">React</text>
        <rect x="220" y="0" width="45" height="24" class="tag-bg"/> <text x="242" y="16" class="tag-text" text-anchor="middle">AWS</text>
        <rect x="275" y="0" width="60" height="24" class="tag-bg"/> <text x="305" y="16" class="tag-text" text-anchor="middle">DevOps</text>
        <rect x="345" y="0" width="90" height="24" class="tag-bg"/> <text x="390" y="16" class="tag-text" text-anchor="middle">Automation</text>
        <rect x="445" y="0" width="75" height="24" class="tag-bg"/> <text x="482" y="16" class="tag-text" text-anchor="middle">CyberQA</text>
        <rect x="530" y="0" width="60" height="24" class="tag-bg"/> <text x="560" y="16" class="tag-text" text-anchor="middle">Docker</text>
        <rect x="600" y="0" width="35" height="24" class="tag-bg"/> <text x="617" y="16" class="tag-text" text-anchor="middle">AI</text>
      </g>
    </g>

    <!-- TARJETAS DE HABILIDADES -->
    <text x="40" y="340" fill="#00e5ff" font-family="monospace" font-size="12" font-weight="bold">KNOWLEDGE MODULES // REGISTERED SKILLS</text>

    <!-- Modulo 1: AWS -->
    <g transform="translate(40, 360)">
      <rect width="295" height="150" rx="10" class="panel"/>
      <text x="20" y="25" class="text-sub" font-family="monospace" font-size="11">MODULE_001</text>
      <text x="20" y="55" fill="#ff9933" font-size="24">☁</text>
      <text x="20" y="85" fill="#ff9933" font-family="sans-serif" font-weight="bold" font-size="16">AWS</text>
      <text x="20" y="110" class="text-sub">Cloud architecture, EC2, Lambda,</text>
      <text x="20" y="128" class="text-sub">S3, DynamoDB, API Gateway.</text>
    </g>

    <!-- Modulo 2: Ollama -->
    <g transform="translate(352, 360)">
      <rect width="295" height="150" rx="10" class="panel"/>
      <text x="20" y="25" class="text-sub" font-family="monospace" font-size="11">MODULE_002</text>
      <text x="20" y="55" fill="#00ff99" font-size="24">◉</text>
      <text x="20" y="85" fill="#00ff99" font-family="sans-serif" font-weight="bold" font-size="16">Ollama</text>
      <text x="20" y="110" class="text-sub">Modelos de IA locales, inferencia</text>
      <text x="20" y="128" class="text-sub">privada y experimentación.</text>
    </g>

    <!-- Modulo 3: Vibe Code -->
    <g transform="translate(664, 360)">
      <rect width="295" height="150" rx="10" class="panel"/>
      <text x="20" y="25" class="text-sub" font-family="monospace" font-size="11">MODULE_003</text>
      <text x="20" y="55" fill="#b366ff" font-size="24" font-family="monospace" font-weight="bold">&lt;/&gt;</text>
      <text x="20" y="85" fill="#b366ff" font-family="sans-serif" font-weight="bold" font-size="16">Vibe Code</text>
      <text x="20" y="110" class="text-sub">De la idea al prototipo funcional</text>
      <text x="20" y="128" class="text-sub">usando desarrollo asistido por IA.</text>
    </g>

    <!-- Modulo 4: Lógica POO -->
    <g transform="translate(40, 525)">
      <rect width="295" height="150" rx="10" class="panel"/>
      <text x="20" y="25" class="text-sub" font-family="monospace" font-size="11">MODULE_004</text>
      <text x="20" y="55" fill="#00d2ff" font-size="24">⬡</text>
      <text x="20" y="85" fill="#00d2ff" font-family="sans-serif" font-weight="bold" font-size="16">Lógica POO</text>
      <text x="20" y="110" class="text-sub">Objetos, encapsulamiento, herencia,</text>
      <text x="20" y="128" class="text-sub">abstracción y diseño de software.</text>
    </g>

    <!-- Modulo 5: Estructura de Datos -->
    <g transform="translate(352, 525)">
      <rect width="295" height="150" rx="10" class="panel"/>
      <text x="20" y="25" class="text-sub" font-family="monospace" font-size="11">MODULE_005</text>
      <text x="20" y="55" fill="#00ff99" font-size="24">⌘</text>
      <text x="20" y="85" fill="#00ff99" font-family="sans-serif" font-weight="bold" font-size="16">Estructura de Datos</text>
      <text x="20" y="110" class="text-sub">Arrays, listas, pilas, colas,</text>
      <text x="20" y="128" class="text-sub">grafos y pensamiento algorítmico.</text>
    </g>

    <!-- Modulo 6: Arquitectura SaaS -->
    <g transform="translate(664, 525)">
      <rect width="295" height="150" rx="10" class="panel"/>
      <text x="20" y="25" class="text-sub" font-family="monospace" font-size="11">MODULE_006</text>
      <text x="20" y="55" fill="#b366ff" font-size="24">△</text>
      <text x="20" y="85" fill="#b366ff" font-family="sans-serif" font-weight="bold" font-size="16">Arquitectura SaaS</text>
      <text x="20" y="110" class="text-sub">Sistemas multicapa, APIs, servicios</text>
      <text x="20" y="128" class="text-sub">en la nube y escalabilidad.</text>
    </g>

    <!-- TERMINAL INFERIOR (ANIMADA DESPUÉS DE CARGAR EL PERFIL) -->
    <g transform="translate(40, 715)">
      <!-- Cabecera de la terminal -->
      <text x="0" y="0" class="text-sub" font-family="monospace" font-size="12">HUMAN // DEVELOPER // PROBLEM SOLVER</text>
      <text x="920" y="0" class="text-sub" font-family="monospace" font-size="12" text-anchor="end">SANTIAGO.SR // v3.0</text>
      
      <rect x="0" y="15" width="920" height="150" rx="8" class="terminal-box" />

      <!-- Logs -->
      <g font-family="monospace" font-size="14" fill="#00ff99">
        <text x="20" y="45">[√] SYSTEM INITIALIZED...</text>
        <text x="20" y="65">[√] LOADING SKILLS REGISTRY...</text>
        <text x="20" y="85">[√] PROFILE VERIFIED...</text>
      </g>

      <!-- Comando de Contratación -->
      <g transform="translate(20, 125)">
        <g mask="url(#typewriter-mask)">
          <text x="0" y="0" class="text-terminal">&gt;&gt; iniciar contratacion developer</text>
        </g>
        
        <text x="350" y="0" class="text-terminal" opacity="0">
          _
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        </text>
      </g>
      
      <line x1="20" y1="150" x2="900" y2="150" stroke="#00e5ff" stroke-width="2" stroke-dasharray="10 5" opacity="0.3"/>
    </g>
  </g>

</svg>
