<svg width="760" height="320" viewBox="0 0 760 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Santiago technical focus chart</title>
  <desc id="desc">A dark card showing Santiago's technical focus areas: Full-Stack, Cloud, AI, Security, Blockchain and Automotive.</desc>
