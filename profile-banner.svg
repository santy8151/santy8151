<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010306"/>
      <stop offset="55%" stop-color="#050f18"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#29e7ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#29e7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="10%" r="30%">
      <stop offset="0%" stop-color="#35ffb0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#35ffb0" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="scanClip">
      <circle cx="150" cy="160" r="84"/>
    </clipPath>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#29e7ff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes ringSpin { to { transform: rotate(360deg); } }
      @keyframes scanMove { 0%,100% { transform: translateY(-56px); opacity:.2;} 50% { transform: translateY(56px); opacity:1;} }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes fadeUp { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
      @keyframes tagIn { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }

      .ring       { transform-origin: 150px 160px; animation: ringSpin 14s linear infinite; }
      .scanline   { animation: scanMove 2.4s ease-in-out infinite; }
      .cursor     { animation: blink .9s steps(1) infinite; }

      .l1 { opacity:0; animation: fadeUp .5s ease-out .4s forwards; }
      .l2 { opacity:0; animation: fadeUp .5s ease-out 1.0s forwards; }
      .l3 { opacity:0; animation: fadeUp .5s ease-out 1.5s forwards; }
      .l4 { opacity:0; animation: fadeUp .5s ease-out 2.0s forwards; }
      .l5 { opacity:0; animation: fadeUp .5s ease-out 2.5s forwards; }

      .tag  { opacity:0; animation: tagIn .4s ease-out forwards; }
      .t1{animation-delay:3.0s} .t2{animation-delay:3.15s} .t3{animation-delay:3.3s}
      .t4{animation-delay:3.45s} .t5{animation-delay:3.6s} .t6{animation-delay:3.75s}

      .access { opacity:0; animation: fadeUp .5s ease-out 4.1s forwards; }

      text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>
  <rect width="900" height="320" fill="url(#grid)"/>
  <rect width="900" height="320" fill="url(#glow1)"/>
  <rect width="900" height="320" fill="url(#glow2)"/>
  <rect x="1" y="1" width="898" height="318" rx="16" fill="none" stroke="#29e7ff" stroke-opacity="0.28"/>

  <!-- top label -->
  <text x="28" y="30" font-size="10" letter-spacing="3" fill="#29e7ff" fill-opacity="0.65">HUMAN // DEVELOPER // PROBLEM SOLVER</text>
  <text x="872" y="30" font-size="10" letter-spacing="2" fill="#29e7ff" fill-opacity="0.65" text-anchor="end">SANTIAGO.SR</text>

  <!-- scanner -->
  <g class="ring">
    <circle cx="150" cy="160" r="84" fill="none" stroke="#29e7ff" stroke-opacity="0.35"/>
    <circle cx="150" cy="160" r="66" fill="none" stroke="#35ffb0" stroke-opacity="0.25" stroke-dasharray="4 5"/>
    <circle cx="150" cy="160" r="48" fill="none" stroke="#35ffb0" stroke-opacity="0.25" stroke-dasharray="4 5"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M150 108c-35 0-64 26-64 68
             M150 121c-27 0-49 20-49 52
             M150 134c-19 0-34 14-34 39
             M150 147c-11 0-19 8-19 26
             M150 160c-4 0-6 3-6 8
             M214 176c0-38-29-68-64-68
             M199 176c0-31-22-55-49-55
             M184 176c0-24-15-42-34-42
             M169 176c0-15-8-26-19-26
             M154 176c0-8-2-13-4-16
             M112 178c0 33 13 63 33 84
             M121 176c0 25 9 47 24 62
             M130 176c0 18 6 34 17 45
             M139 176c0 12 3 22 10 29
             M148 176c0 6 2 12 6 17"
      stroke="#29e7ff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <g clip-path="url(#scanClip)">
    <rect class="scanline" x="80" y="158" width="140" height="2.4" fill="#35ffb0"/>
  </g>

  <!-- status column under scanner -->
  <g font-size="10.5" fill="#6f93a3">
    <text x="60" y="262">[✓] SCANNING BIOMETRIC DATA...</text>
    <text x="60" y="278">[✓] MATCHING IDENTITY...</text>
  </g>
  <text class="access" x="150" y="300" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#35ffb0">✓ ACCESS GRANTED</text>

  <!-- divider -->
  <line x1="290" y1="40" x2="290" y2="290" stroke="#29e7ff" stroke-opacity="0.15"/>

  <!-- profile text -->
  <g>
    <text class="l1" x="322" y="70" font-size="12" fill="#35ffb0" letter-spacing="1.5">✓ PROFILE REGISTERED</text>
    <text class="l2" x="322" y="106" font-size="26" font-weight="700" fill="#e4f7fb">Santiago Suarez Ramirez</text>
    <text class="l3" x="322" y="130" font-size="14" fill="#29e7ff">Software Developer</text>
    <text class="l3" x="322" y="148" font-size="11.5" fill="#6f93a3">Full-Stack · Cloud · AI</text>
    <text class="l4" x="322" y="172" font-size="11.5" fill="#6f93a3">Medellín, Colombia</text>

    <text class="l5" x="322" y="200" font-size="12" fill="#a8c5ce">
      <tspan x="322" dy="0">Sistemas que combinan cloud, IA, ciberseguridad,</tspan>
      <tspan x="322" dy="16">automatización, blockchain y diagnóstico automotriz.</tspan>
    </text>
  </g>

  <!-- skill tags -->
  <g font-size="10.5" fill="#29e7ff">
    <g class="tag t1"><rect x="322" y="238" width="52" height="22" rx="11" fill="none" stroke="#29e7ff" stroke-opacity="0.45"/><text x="348" y="253" text-anchor="middle">AWS</text></g>
    <g class="tag t2"><rect x="382" y="238" width="70" height="22" rx="11" fill="none" stroke="#35ffb0" stroke-opacity="0.45"/><text x="417" y="253" text-anchor="middle" fill="#35ffb0">Ollama</text></g>
    <g class="tag t3"><rect x="460" y="238" width="90" height="22" rx="11" fill="none" stroke="#9b6bff" stroke-opacity="0.45"/><text x="505" y="253" text-anchor="middle" fill="#9b6bff">Vibe Code</text></g>
    <g class="tag t4"><rect x="558" y="238" width="58" height="22" rx="11" fill="none" stroke="#4fb2ff" stroke-opacity="0.45"/><text x="587" y="253" text-anchor="middle" fill="#4fb2ff">POO</text></g>
    <g class="tag t5"><rect x="624" y="238" width="112" height="22" rx="11" fill="none" stroke="#32f7b7" stroke-opacity="0.45"/><text x="680" y="253" text-anchor="middle" fill="#32f7b7">Estruct. Datos</text></g>
    <g class="tag t6"><rect x="744" y="238" width="106" height="22" rx="11" fill="none" stroke="#b18cff" stroke-opacity="0.45"/><text x="797" y="253" text-anchor="middle" fill="#b18cff">SaaS Arch.</text></g>
  </g>

  <!-- terminal footer -->
  <line x1="28" y1="284" x2="872" y2="284" stroke="#29e7ff" stroke-opacity="0.12"/>
  <text x="322" y="306" font-size="11.5" fill="#35ffb0">root@santiago:~$ identity --load developer.profile<tspan class="cursor" fill="#35ffb0">_</tspan></text>
</svg>
